name: Build APK

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build libre APK
        run: |
          NDK_VERSION=28.2.13676358
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export ANDROID_NDK_ROOT=$ANDROID_NDK
          export AVES_GOOGLE_API_KEY="NONE"
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --target-platform android-arm64 --debug

      - uses: actions/upload-artifact@v4
        with:
          name: aves-libre-apk
          path: build/app/outputs/flutter-apk/*.apk
