name: Build APK

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: key.jks
          key: aves-keystore-v1

      - name: Create keystore if missing
        run: |
          if [ ! -f key.jks ]; then
            keytool -genkeypair -keystore key.jks -storepass aves123456 -keypass aves123456 -alias aves -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=aves"
          fi

      - name: Get Flutter packages
        run: |
          ./flutterw doctor -v
          ./flutterw pub get

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build libre release APK
        run: |
          NDK_VERSION=28.2.13676358
          export ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export ANDROID_NDK_ROOT=$ANDROID_NDK
          scripts/apply_flavor_libre.sh
          ./flutterw build apk -t lib/main_libre.dart --flavor libre --target-platform android-arm64
        env:
          AVES_STORE_FILE: ${{ github.workspace }}/key.jks
          AVES_STORE_PASSWORD: aves123456
          AVES_KEY_ALIAS: aves
          AVES_KEY_PASSWORD: aves123456
          AVES_GOOGLE_API_KEY: "NONE"

      - uses: actions/upload-artifact@v4
        with:
          name: aves-libre-apk
          path: build/app/outputs/apk/libre/release/*.apk
